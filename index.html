<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Welcome to Sun Valley Roasts!">
        <title>Sun Valley Roasts Coffee Co.</title>
        <meta name="author" content="Garrett Chin">
        <!-- Stylesheets -->
        <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
        <link rel="stylesheet" href="styles.css">
        <!-- Scripts loaded in <head> with defer in dependency order -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
        <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js" defer></script>
        <script src="scripts.js" defer></script>
        <!-- FAVICON -->
        <link rel="icon" href="images/favicon.ico" type="image/x-icon">
        <!-- GOOGLE FONTS LINKS -->
        <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    </head>

    <body>
        <main>
            <!-- Featured Menu Section populated via AJAX -->
            <section id="menu" class="menu-section">
                <h1>Signature Café Menu</h1>
                <p class="section-intro">Crafted daily using small-batch beans roasted in-house.</p>

                <!-- AJAX content will be injected into this container -->
                <div id="menu-grid" class="menu-grid" aria-live="polite">
                    <p class="loading-msg">Loading today's menu...</p>
                </div>
            </section>
            <!-- 1. Personalized Web Storage Banner (Hidden until an order is saved) -->
            <aside id="saved-order-banner" class="saved-order-banner" hidden aria-live="polite">
                <p id="saved-order-text"></p>
                <button type="button" id="clear-order-btn" class="btn-secondary">Clear Saved Order</button>
            </aside>

            <!-- 2. Save Your Favorite Order Section -->
            <section id="save-order" class="order-section">
                <h2>Save Your Go-To Order</h2>
                <p>Store your favorite drink in your browser so we remember it next time you visit.</p>

                <form id="favorite-order-form" class="order-form">
                    <div class="form-group">
                    <label for="customer-name">Your Name</label>
                    <input type="text" id="customer-name" name="customerName" placeholder="e.g., Jordan" required>
                    </div>

                    <div class="form-group">
                    <label for="favorite-drink">Favorite Drink</label>
                    <select id="favorite-drink" name="favoriteDrink" required>
                        <option value="">-- Choose a drink --</option>
                        <option value="Sonoran Honey Cortado">Sonoran Honey Cortado</option>
                        <option value="Prickly Pear Cold Brew">Prickly Pear Cold Brew</option>
                        <option value="Spiced Cardamom Oat Latte">Spiced Cardamom Oat Latte</option>
                        <option value="Ethiopia Yirgacheffe Pour Over">Ethiopia Yirgacheffe Pour Over</option>
                    </select>
                    </div>

                    <div class="form-group">
                    <label for="milk-choice">Milk / Preference</label>
                    <select id="milk-choice" name="milkChoice">
                        <option value="Whole Milk">Whole Milk</option>
                        <option value="Oat Milk">Oat Milk</option>
                        <option value="Almond Milk">Almond Milk</option>
                        <option value="Black / No Milk">Black / No Milk</option>
                    </select>
                    </div>

                    <div class="form-group">
                    <label for="temp-choice">Temperature</label>
                    <select id="temp-choice" name="tempChoice">
                        <option value="Hot">Hot</option>
                        <option value="Iced">Iced</option>
                    </select>
                    </div>

                    <button type="submit" class="btn-primary">Save My Order</button>
                </form>
            </section>
        </main>
    </body>
</html>
